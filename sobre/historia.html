<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa História — Agricampo Jr.</title>
  <meta name="description" content="A história da Agricampo Jr., empresa júnior de Agronomia de São João Evangelista - MG, e a sede da instituição.">
  <link rel="icon" type="image/png" href="/assets/img/logo/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/assets/img/logo/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/img/logo/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div data-include="/assets/partials/header.html"></div>

  <main id="conteudo">

    <!-- NOSSA HISTÓRIA + MAPA DE MG (CONTEXT.md §6.6 — mapa ao lado do texto) -->
    <section class="secao secao--clara">
      <div class="container">
        <div class="secao__cabecalho">
          <span class="rotulo-secao">Sobre</span>
          <h1 class="secao__titulo--caps">Nossa história</h1>
        </div>

        <div class="grid grid--2" style="align-items:start;gap:3rem">
          <div class="medida-leitura">
            <!-- PENDENTE (CONTEXT.md §6.1): 2–3 parágrafos de história -->
            <p>PENDENTE — parágrafo 1 da história da Agricampo Jr.</p>
            <p style="margin-top:1rem">PENDENTE — parágrafo 2.</p>
            <p style="margin-top:1rem">PENDENTE — parágrafo 3.</p>
            <p style="margin-top:1.5rem">
              <strong>Faculdade, ano de fundação e federação:</strong> em breve.
            </p>
          </div>

          <figure>
            <!-- Mapa de MG: SVG estático + pin posicionado por CSS (CONTEXT.md §6.6).
                 ⚠️ Substituir este retângulo pelo contorno real de MG em
                 assets/img/mapa/minas-gerais.svg. O pin usa a posição de
                 site.js → localizacao.pinMapa. -->
            <div class="mapa-mg">
              <svg class="mapa-mg__svg" viewBox="0 0 400 320" role="img"
                   aria-label="Mapa de Minas Gerais com a localização de São João Evangelista">
                <rect x="8" y="8" width="384" height="304" rx="16" fill="currentColor" opacity="0.12"/>
                <text x="200" y="165" text-anchor="middle" font-size="13" fill="#0b500d" opacity="0.6">
                  contorno de MG (SVG pendente)
                </text>
              </svg>
              <span class="mapa-mg__pin" style="top:34%;left:72%"></span>
              <span class="mapa-mg__rotulo" style="top:38%;left:66%">São João Evangelista</span>
            </div>
            <figcaption class="membro__cargo" style="margin-top:.75rem">
              São João Evangelista, Vale do Rio Doce — Minas Gerais.
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <!-- NOSSA SEDE — foto aérea (drone) (CONTEXT.md §6.7 — PENDENTE de produção) -->
    <section class="secao secao--escura" id="sede">
      <div class="container">
        <div class="secao__cabecalho">
          <span class="rotulo-secao">Onde estamos</span>
          <h2 class="secao__titulo--caps">Nossa sede</h2>
        </div>
        <!-- arquivo esperado: assets/img/sede/aerea.jpg (foto aérea/drone, produção pendente) -->
        <div class="card" style="display:grid;place-items:center;min-height:320px;text-align:center">
          <p class="card__texto">
            Em breve, uma foto aérea da nossa sede.
          </p>
        </div>
        <p style="margin-top:2rem">
          <a class="btn btn--claro" href="/contato.html#como-chegar">Ver como chegar</a>
        </p>
      </div>
    </section>

  </main>

  <div data-include="/assets/partials/footer.html"></div>
</body>
</html>
