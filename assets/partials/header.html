<!-- header.html — injetado por includes.js em todas as páginas.
     Caminhos SEM barra inicial (ex: "servicos.html", não "/servicos.html") —
     cada página define <base href="./"> (raiz) ou <base href="../"> (sobre/),
     e é essa tag que resolve o caminho certo pra onde a página realmente está.
     Sem <base>, este mesmo header.html quebraria ao ser injetado em /sobre/. -->
<header class="cabecalho">
  <div class="container cabecalho__inner">
    <a class="cabecalho__logo" href="." aria-label="Agricampo Jr. — página inicial">
      <!-- logo horizontal (pedido 14/10/2026): as duas formas da logo original,
           separadas, abraçando o nome — como o "AGRICAMPO" fica entre elas na logo.
           Esquerda branca e direita verde, igual a "AGRICAMPO" + "JR.". As formas
           foram extraídas da agricampo-logo-branca.png sem alterar o desenho. -->
      <img class="cabecalho__simbolo" src="assets/img/logo/simbolo-esquerda.png" alt="" width="36" height="44">
      <span class="cabecalho__nome">Agricampo <span>Jr.</span></span>
      <img class="cabecalho__simbolo" src="assets/img/logo/simbolo-direita.png" alt="" width="36" height="44">
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-principal"
            aria-label="Abrir menu">
      <span class="nav-toggle__barra"></span>
    </button>

    <nav class="nav-principal" id="nav-principal" aria-label="Navegação principal">
      <ul class="nav-principal__lista">
        <li><a class="nav-principal__link" href=".">Início</a></li>
        <li class="nav-principal__item--tem-sub">
          <a class="nav-principal__link" href="sobre/historia.html">Sobre</a>
          <div class="nav-principal__sub">
            <a href="sobre/historia.html">Nossa História</a>
            <a href="sobre/historia.html#sede">Nossa Sede</a>
            <a href="sobre/equipe.html">Equipe</a>
            <a href="contato.html#como-chegar">Como Chegar</a>
          </div>
        </li>
        <li><a class="nav-principal__link" href="servicos.html">Serviços</a></li>
        <li><a class="nav-principal__link" href="certificados.html">Certificados</a></li>
        <li><a class="nav-principal__link" href="cases.html">Depoimentos</a></li>
        <li><a class="nav-principal__link" href="contato.html">Contato</a></li>
      </ul>
      <a class="btn btn--acento cabecalho__cta" href="contato.html">Fale com a gente</a>
    </nav>
  </div>
</header>
